# Espejo de la metadata de pyproject.toml para setuptools viejos (<61, sin PEP 621).
# El público de este arnés es hardware modesto con herramientas de sistema: instalar
# tiene que funcionar también ahí. Medido 2026-08-25: con setuptools 59.6 el pyproject
# solo producía UNKNOWN-0.0.0.
[metadata]
name = mekro-genai
version = 0.1.0
description = Arnés agéntico de ingeniería para cerebros locales cuantizados, en CPU y sin nube
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
packages = find:
python_requires = >=3.10
install_requires =

[options.extras_require]
local =
    llama-cpp-python>=0.3

[options.packages.find]
include = genai*

[options.entry_points]
console_scripts =
    genai = genai.__main__:main
